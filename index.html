<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IBLORDZ</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080b14;
      font-family: Arial, Helvetica, sans-serif;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 30px;
    }

    .logo-icon {
      width: 90px;
      height: 90px;
      background: #0b1020;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.15);
    }

    .brand {
      color: white;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .accent {
      width: 150px;
      height: 4px;
      margin-top: 8px;
      border-radius: 5px;
      background: linear-gradient(90deg, #00e5ff, #7c3aed);
    }

    @media (max-width: 600px) {
      .logo {
        gap: 12px;
      }

      .logo-icon {
        width: 65px;
        height: 65px;
        border-radius: 17px;
      }

      .brand {
        font-size: 30px;
        letter-spacing: 2px;
      }

      .accent {
        width: 100px;
        height: 3px;
      }
    }
  </style>
</head>

<body>

  <div class="logo">

    <!-- IBLORDZ Logo Icon -->
    <div class="logo-icon">
      <svg
        width="75"
        height="75"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg">

        <defs>
          <linearGradient
            id="ibGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">

            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="100%" stop-color="#7C3AED"/>

          </linearGradient>
        </defs>

        <!-- I -->
        <path
          d="M18 25 H42 V34 H29 V42 H40 V51 H29 V75 H18 Z"
          fill="url(#ibGradient)"
        />

        <!-- B -->
        <path
          d="
          M48 25
          H64
          C76 25 82 31 82 40
          C82 45 80 48 76 51
          C81 53 84 58 84 64
          C84 73 77 78 65 78
          H48 Z

          M59 46
          H63
          C68 46 70 44 70 40
          C70 36 68 34 63 34
          H59 Z

          M59 69
          H65
          C70 69 73 67 73 63
          C73 59 70 57 65 57
          H59 Z
          "
          fill="white"
        />

      </svg>
    </div>

    <!-- Brand Name -->
    <div>
      <div class="brand">IBLORDZ</div>
      <div class="accent"></div>
    </div>

  </div>

</body>
</html>
